# Servidor do Duelo ao vivo (Cloudflare Workers, plano grátis).
# Só o duelo usa internet; o resto do jogo continua offline.
name = "kravenox-duelo"
main = "src/index.js"
compatibility_date = "2025-06-01"

[[durable_objects.bindings]]
name = "SALAS"
class_name = "Sala"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Sala"]

# 13/11: ranking semanal e Ordens (clãs), guardados em Durable Objects (SQLite, plano grátis)
[[durable_objects.bindings]]
name = "RANKING"
class_name = "Ranking"

[[durable_objects.bindings]]
name = "ORDENS"
class_name = "Ordem"

[[migrations]]
tag = "v2"
new_sqlite_classes = ["Ranking", "Ordem"]

# 14/11: sala livre (até 8 jogadores) para outros jogos do Kravenox
[[durable_objects.bindings]]
name = "SALAS_LIVRES"
class_name = "SalaLivre"

[[migrations]]
tag = "v3"
new_sqlite_classes = ["SalaLivre"]

# 15/11: contas (usuário e senha) para o ranking
[[durable_objects.bindings]]
name = "CONTAS"
class_name = "Contas"

[[migrations]]
tag = "v4"
new_sqlite_classes = ["Contas"]

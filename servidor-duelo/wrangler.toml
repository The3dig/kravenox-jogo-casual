# Servidor do Duelo ao vivo (Cloudflare Workers, plano grátis).
# Só o duelo usa internet; o resto do jogo continua offline.
name = "kravenox-duelo"
main = "src/index.js"
compatibility_date = "2025-06-01"

[[durable_objects.bindings]]
name = "SALAS"
class_name = "Sala"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Sala"]

# 13/11: ranking semanal e Ordens (clãs), guardados em Durable Objects (SQLite, plano grátis)
[[durable_objects.bindings]]
name = "RANKING"
class_name = "Ranking"

[[durable_objects.bindings]]
name = "ORDENS"
class_name = "Ordem"

[[migrations]]
tag = "v2"
new_sqlite_classes = ["Ranking", "Ordem"]
